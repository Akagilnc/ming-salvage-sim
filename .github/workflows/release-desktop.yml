name: release-desktop

# Desktop zip packaging for Ming_LLM.
#
# PyInstaller does not cross-compile: Windows packages must be built on a
# Windows runner, and macOS .app bundles must be built on a macOS runner.
#
# Triggers:
#   - push tag v* -> build macOS + Windows zips and attach them to a GitHub Release
#   - workflow_dispatch -> build both zips and upload artifacts only

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS zip
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview tiktoken

      - name: Build macOS package
        run: scripts/build_release.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ming_LLM-macos
          path: dist/Ming_LLM-macos.zip
          retention-days: 14

  build-windows:
    name: Build Windows zip
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Windows pywebview EdgeChromium backend needs pythonnet.
          pip install pyinstaller pywebview pythonnet tiktoken

      - name: Build Windows package
        shell: cmd
        run: scripts\build_release.bat

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ming_LLM-windows
          path: dist/Ming_LLM-windows.zip
          retention-days: 14

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-macos
      - build-windows

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ming_LLM-macos.zip
            dist/Ming_LLM-windows.zip
          body: |
            Ming_LLM desktop packages.

            - macOS: unzip `Ming_LLM-macos.zip`, then open `Ming_LLM.app`.
            - Windows: unzip `Ming_LLM-windows.zip`, then run `Ming_LLM.exe`.

            The LLM backend is configured in the in-game settings. Windows users
            may need WebView2 Runtime if the webview window is blank:
            https://developer.microsoft.com/microsoft-edge/webview2/
