name: CI

# Python 契约检查与测试 + web 构建/类型检查。
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python（P8 约束 + 分层 + 类型 + 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # P8 五项 + TID251 + PGH004。带码的 noqa 也不能豁免。
      - run: ruff check --ignore-noqa .
      # ruff 没有「豁免配置」开关，per-file-ignores 一出现就失败。
      - run: "! grep -n 'per-file-ignores' pyproject.toml"
      # P8 单文件 1000 行（ruff 无此规则）；全仓已跟踪 Python。
      - run: git ls-files '*.py' | xargs wc -l | awk '$2 != "total" && $1 > 1000 {print; bad = 1} END {exit bad}'
      - run: lint-imports
      - run: pyright
      - run: python -m pytest tests/ -q

  web:
    name: Web 构建 + 类型检查 (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # build = tsc -b && vite build；不含 vitest。
      - run: npm run build
