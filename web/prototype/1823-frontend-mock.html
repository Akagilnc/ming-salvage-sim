<!doctype html>
<!--
  PROTOTYPE · throwaway · #1823 独立前端怎样接住召对、过月和恢复过程
  ------------------------------------------------------------------
  计划：两屏（召对一轮 / 核账期）× 三个结构不同的变体，同一文件内以 ?screen=&variant=&state= 切换，
  底部浮条左右箭头（或键盘 ← →）换变体，浮条上的按钮换「状态」（流式中 / 转译到了 / 待补重试 / 中断重试 …）。
  子形态：B（独立页）。原因：召对与核账期的真实宿主页需要后端活局 + 真实 LLM 才能渲染，无法在 ?variant= 下挂真数据；
  为保证密度与质感真实，直接内联 web/src/styles 里的真实 CSS（base / chat / modals / decision / hud2 / situation 片段），
  文本全部来自北极星「乾清宫一夜」洪承畴段与实战实录十一月邸报《风雷一夜扫沉阴》，不编造台词。
  不落库、不发请求；所有状态只在内存。看完即扔，胜出者按 wayfinder / prototype 规则折进 resolution。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#1823 前端 mock · 召对 / 核账期</title>
<style>
/* ───────── 真实样式（自 web/src/styles 内联，逐字节未改除注明） ───────── */
:root {
  color-scheme: light;
  font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;

  color: #1a1410;
  background: #1c211d;

  --gold: #d2a34a;
  --gold-soft: #8a6424;
  --red: #8f2f25;
  --jade: #315d47;
  --blue: #39596a;
  --paper: #26190f;

  --ink: #21180f;

* { box-sizing: border-box; }

.game-shell {
  position: relative; width: 100vw; height: 100vh; min-width: 0; overflow: hidden;
  background:
    radial-gradient(circle at 56% 40%, rgba(213, 187, 115, 0.18), transparent 30%),
    linear-gradient(145deg, #222a23 0%, #12130f 100%);
}
/* modals.css */
.fullscreen-modal {
  position: absolute; inset: 8px; display: grid; grid-template-rows: auto minmax(0, 1fr);
  min-width: 0; min-height: 0; border: 1px solid rgba(226, 180, 86, 0.38); border-radius: 5px;
  background: linear-gradient(180deg, rgba(48, 39, 28, 0.98), rgba(23, 20, 16, 0.98));
  box-shadow: 0 30px 86px rgba(0, 0, 0, 0.56), inset 0 1px 0 rgba(255, 232, 162, 0.14);
}
.modal-header-bare { position: absolute; top: 0; right: 0; left: 0; z-index: 5; min-height: 0; padding: 10px 14px; border-bottom: none; background: none; pointer-events: none; }
.modal-header-bare .modal-header-actions { margin-left: auto; pointer-events: auto; display: flex; justify-content: flex-end; }
.modal-pane { min-width: 0; min-height: 0; padding: 14px; }
.modal-pane h2 { margin: 0 0 10px; color: #704c1e; font-size: 1rem; letter-spacing: 0; }
.modal-bg-chat .modal-pane { background: rgba(255, 255, 255, 0.8); border-radius: 6px; }
.modal-bg-chat.fullscreen-modal.modal-layout-bare { grid-template-rows: minmax(0, 1fr); }
.modal-bg-chat.fullscreen-modal.modal-layout-bare > .chat-full-grid { min-height: 0; max-height: 100%; overflow: hidden; }
.modal-bg-chat .modal-header-bare .icon-button { width: 40px; height: 40px; border: 1px solid rgba(0, 0, 0, 0.28); border-radius: 8px; color: #1a1410; background: rgba(255, 250, 235, 0.9); }
.icon-button { display: inline-grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; border: 1px solid rgba(111, 83, 46, 0.2); border-radius: 6px; color: #704c1e; background: rgba(255, 250, 235, 0.54); }
/* chat.css */
.chat-full-grid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 12px; min-height: 0; padding: 14px; background: rgba(255, 255, 255, 0.8); }
.minister-side { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }
.minister-profile { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.minister-profile h2 { margin: 0; color: var(--paper); font-size: 1.2rem; }
.minister-profile p { margin: 2px 0 0; color: var(--muted); }
.hitl-bar { display: flex; flex-wrap: wrap; gap: 6px; }
.chat-main { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; min-height: 0; }
.chat-log, .scroll-messages { display: flex; flex-direction: column; gap: 10px; }
.chat-log { min-height: 0; overflow-y: auto; padding: 4px 6px 4px 4px; }
.chat-message { display: grid; gap: 4px; width: fit-content; max-width: min(760px, 78%); padding: 10px; border-radius: 5px; background: rgba(255, 238, 198, 0.68); }
.chat-message.user { align-self: flex-end; border: 1px solid rgba(143, 47, 37, 0.24); background: linear-gradient(90deg, rgba(143, 47, 37, 0.1), transparent 34%), rgba(255, 230, 189, 0.82); }
.chat-message.minister { align-self: flex-start; border: 1px solid rgba(49, 93, 71, 0.26); }
.chat-message.aside { position: relative; align-self: flex-start; margin-left: 62px; max-width: min(680px, 72%); border: 1px dashed rgba(111, 83, 46, 0.5); background: rgba(255, 238, 198, 0.5); }
.aside-avatar { position: absolute; left: -54px; top: 2px; width: 44px; height: 44px; border: 1px solid rgba(111, 83, 46, 0.4); border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; color: #704c1e; background: rgba(255, 238, 198, 0.9); }
.chat-message.aside p { font-style: italic; }
.chat-message .action { display: block; margin-bottom: 6px; color: #94805d; font-size: 0.9rem; font-style: italic; font-weight: 400; line-height: 1.6; }
.chat-message span { color: #704c1e; font-size: 0.78rem; font-weight: 700; }
.chat-message p { margin: 0; color: #3e3020; white-space: pre-wrap; }
.chat-message.minister mark.hl, .p-scroll mark.hl, .p-script mark.hl { background: rgba(196, 148, 58, 0.28); color: inherit; padding: 0 1px; border-radius: 2px; }
.chat-message.scene { align-self: stretch; width: auto; max-width: none; background: none; padding: 4px 18px; }
.chat-message.scene p { color: #6d5a3d; font-style: italic; text-align: center; font-weight: 400; }
.chat-composer { display: grid; gap: 8px; padding-top: 10px; padding-bottom: 54px; border-top: 1px solid rgba(111, 83, 46, 0.18); } /* 原型：让开底部浮条 */
.hitl-bar button { min-height: 30px; padding: 5px 8px; border: 1px solid rgba(111, 83, 46, 0.22); border-radius: 4px; color: #573d1f; background: rgba(255, 238, 198, 0.56); }
.chat-input { display: grid; gap: 6px; color: var(--muted); }
textarea { width: 100%; border: 1px solid rgba(80, 52, 24, 0.28); border-radius: 4px; color: var(--paper); background: rgba(255, 241, 208, 0.82); min-height: 94px; resize: vertical; padding: 9px; }
.chat-input textarea { min-height: 70px; max-height: 190px; }
.composer-actions { display: flex; align-items: center; gap: 10px; }
.primary-action { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 18px; border: 1px solid rgba(226, 180, 86, 0.38); border-radius: 4px; color: #ffe4b0; background: linear-gradient(90deg, rgba(255, 225, 143, 0.16), transparent 34%), linear-gradient(180deg, #9c392c, #561f19); font-weight: 700; }
.composer-hint, .chat-system-note { color: #704c1e; font-size: 0.86rem; }
.chat-system-note { align-self: center; width: fit-content; max-width: 82%; padding: 7px 10px; border: 1px dashed rgba(111, 83, 46, 0.2); border-radius: 999px; background: rgba(255, 250, 235, 0.55); }
.chat-system-note.danger { color: #82291f; border-color: rgba(164, 64, 54, 0.28); background: rgba(185, 73, 55, 0.1); }
.chat-failure-note { display: flex; align-items: center; gap: 8px; border-style: solid; }
.chat-failure-note button { flex: 0 0 auto; padding: 4px 9px; border-radius: 6px; border: 1px solid rgba(130, 41, 31, 0.38); color: #7c251d; background: rgba(255, 255, 255, 0.72); }
.chat-message.thinking p { display: inline-flex; align-items: center; gap: 6px; }
/* hud2.css 片段 */
.hud2-stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, calc(100vh * 2560 / 1440)); height: min(100vh, calc(100vw * 1440 / 2560)); z-index: 2; container-type: size; overflow: hidden; }
.hud2-slot { position: absolute; z-index: 4; display: flex; align-items: center; gap: 8px; color: #f6eccf; }
.hud2-lab { font-size: 1.3cqh; color: #c9b48a; letter-spacing: 0.04em; }
.hud2-val { font-size: 2.3cqh; font-weight: 700; color: #f6eccf; }
.hud2-block { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
.hud2-metric-one { display: flex; flex-direction: column; margin-right: 1.4cqw; line-height: 1.1; }
.hud2-metric-one.warn .hud2-val { color: #f2c66a; }
.hud2-nav { position: absolute; left: 90.4%; width: 5.2cqw; height: 6cqh; display: grid; place-items: center; color: #e8cf98; font-size: 2.4cqh; border: 1px solid rgba(226, 180, 86, 0.28); border-radius: 4px; background: rgba(20, 14, 8, 0.55); }
.hud2-nav.settlement-closed { opacity: 0.45; cursor: not-allowed; }
/* situation.css：王承恩递话条、结算流 */
.wang-settlement-slip { position: absolute; left: 50%; bottom: 11%; transform: translateX(-50%); z-index: 12; max-width: min(560px, 70%); padding: 10px 18px; border: 1px solid rgba(214, 175, 89, 0.5); border-radius: 6px; background: rgba(20, 14, 8, 0.88); color: #f4e2b8; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35); display: flex; gap: 10px; align-items: baseline; pointer-events: none; }
.wang-settlement-slip-speaker { flex: 0 0 auto; color: #d6af59; font-size: 13px; letter-spacing: 1px; }
.wang-settlement-slip-body { font-size: 15px; line-height: 1.55; }
/* decision.css：批红真文书页 + 恢复横幅 */
.decision-page { position: fixed; inset: 0; z-index: 9200; overflow-y: auto; overscroll-behavior: contain; background: #261a0d; padding: clamp(12px, 2.2vw, 24px) clamp(12px, 5vw, 86px); }
.decision-document { width: min(880px, 100%); min-height: calc(100vh - clamp(24px, 5vw, 56px)); margin: 0 auto; padding: clamp(16px, 2.8vw, 32px) clamp(24px, 5vw, 72px); background: #e6d5ae; color: #342418; border: 1px solid #9e783a; box-shadow: inset 0 0 0 5px rgba(92, 54, 20, 0.12), 0 2px 12px rgba(0, 0, 0, 0.25); }
.decision-document .decision-kicker { color: #76521d; }
.decision-document .decision-title { color: #3b1f16; text-align: center; font-family: serif; }
.decision-document section { border: 1px solid rgba(87, 51, 18, 0.42); padding: clamp(10px, 1.6vw, 16px); background: rgba(255, 246, 218, 0.5); }
.decision-document-section { padding: 4px 0 12px; border-bottom: 1px solid rgba(87, 51, 18, 0.25); }
.decision-document-section + .decision-document-section { margin-top: 8px; }
.decision-document-section h3 { margin: 2px 0 6px; font-family: serif; font-size: 20px; color: #3b1f16; }
.decision-document-section p { margin: 0; line-height: 1.7; color: #4d3523; font-weight: 400; }
.decision-section-label { display: block; color: #8f1d16; font-family: serif; font-weight: 700; letter-spacing: 2px; }
.decision-kicker { display: inline-block; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; }
.decision-title { margin: 0; font-size: 23px; letter-spacing: 1px; }
.decision-options { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 10px; }
.decision-option { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 10px 14px; border: 1px solid rgba(113, 63, 24, 0.45); border-radius: 7px; background: rgba(255, 250, 232, 0.5); color: #3d2a1d; }
.decision-option.is-picked { border-color: #9f211b; background: rgba(159, 33, 27, 0.14); box-shadow: inset 0 0 0 1px rgba(159, 33, 27, 0.45); }
.decision-option-label { color: #5a241d; }
.decision-option-hint { color: #70563c; font-weight: 400; font-size: 0.9rem; }
.decision-note { margin-top: 8px; border: 1px solid rgba(113, 63, 24, 0.45); background: rgba(255, 250, 232, 0.65); color: #3d2a1d; min-height: 64px; }
.decision-document .decision-confirm { display: block; margin: 10px auto 2px; width: max-content; padding: 8px 16px; border: 3px double #9f211b; border-radius: 2px; background: rgba(255, 246, 218, 0.55); color: #9f211b; font-family: serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; transform: rotate(-5deg); white-space: nowrap; }
.recovery-banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 9300; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; padding: 10px 18px; width: min(720px, 92vw); border: 1px solid rgba(214, 175, 89, 0.5); border-radius: 8px; background: rgba(20, 14, 8, 0.94); color: #f4e2b8; box-shadow: 0 10px 24px rgba(0,0,0,.4); }
.recovery-banner-message { white-space: pre-line; line-height: 1.45; min-width: 0; flex: 1 1 12rem; }
.seal-btn-issue { padding: 8px 26px; font-size: 1rem; font-weight: 800; letter-spacing: 0.18em; border-radius: 4px; border: 1px solid rgba(226,180,86,.38); color: #ffe4b0; background: linear-gradient(180deg, #9c392c, #561f19); }

/* ───────── 原型专用样式（前缀 p-） ───────── */
.p-roster { display: grid; gap: 8px; }
.p-roster-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid rgba(111,83,46,.18); border-radius: 6px; background: rgba(255,248,230,.6); }
.p-roster-item.p-summon { border-style: dashed; color: #8a6424; cursor: pointer; }
.p-avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; color: #704c1e; background: rgba(255,238,198,.95); border: 1px solid rgba(111,83,46,.35); }
.p-roster-item small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
.p-secret { margin-top: auto; padding: 10px; border: 1px solid rgba(111,83,46,.22); border-radius: 6px; background: rgba(255,248,230,.6); }
.p-secret .p-lab { font-size: .8rem; color: #704c1e; letter-spacing: .1em; }
.p-secret p { margin: 4px 0 0; font-weight: 400; font-size: .9rem; color: #3e3020; }
.p-audience-label { align-self: center; font-size: .82rem; color: #8a6424; letter-spacing: .3em; }
.p-caret::after { content: "▍"; color: #a4862f; animation: blink 1s steps(2) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.p-status-tag { font-size: .72rem; color: #94805d; font-weight: 400; letter-spacing: .08em; }

/* 立绘位（真资产 341:512，同现 app 左栏 .chat-portrait-wrap） */
.chat-portrait-wrap { position: sticky; bottom: 0; flex: 0 1 auto; width: 100%; aspect-ratio: 341 / 512; max-height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; align-self: flex-start; margin: auto 0 0; position: relative; }
.chat-portrait-wrap img { width: 100%; height: 100%; object-fit: contain; object-position: center top; border-radius: 10px; }
.p-portrait-cap { position: absolute; left: 10px; bottom: 10px; padding: 5px 9px; border-radius: 4px; background: rgba(20,14,8,.74); color: #f4e2b8; font-size: .72rem; font-weight: 400; letter-spacing: .06em; }
.p-portrait-cap b { display: block; font-size: 1rem; letter-spacing: .12em; }
.p-roster.p-compact { grid-template-columns: 1fr 1fr; gap: 6px; }
.p-roster.p-compact .p-roster-item { padding: 4px 6px; }
.p-roster.p-compact .p-roster-item small { display: none; }
.p-roster-item.p-absent { opacity: .38; }
.p-avatar { overflow: hidden; }
.p-avatar img, .aside-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; border-radius: 50%; }
.aside-avatar { overflow: hidden; padding: 0; }
.p-stage-strip { display: flex; gap: 14px; align-items: flex-end; justify-content: center; padding: 4px 10px 0; border-bottom: 1px solid rgba(111,83,46,.18); }
.p-stage-fig { position: relative; width: 118px; height: 156px; border-radius: 8px 8px 0 0; overflow: hidden; background: rgba(255,238,198,.5); border: 1px solid rgba(111,83,46,.25); border-bottom: none; opacity: .5; filter: saturate(.7); }
.p-stage-fig img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.p-stage-fig.p-speaking { opacity: 1; filter: none; border-color: rgba(143,47,37,.5); box-shadow: 0 -4px 14px rgba(143,47,37,.18); }
.p-stage-fig.p-absent { opacity: .16; filter: grayscale(1); }
.p-stage-fig span { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 0; text-align: center; font-size: .72rem; color: #f4e2b8; background: rgba(20,14,8,.7); }
.chat-main.p-with-stage { grid-template-rows: auto minmax(0,1fr) auto; }

/* 变体 A：一卷戏文（一轮一块，段内原位上样式） */
.p-scroll { align-self: flex-start; width: min(860px, 92%); padding: 12px 16px 12px; border: 1px solid rgba(49, 93, 71, 0.26); border-radius: 5px; background: rgba(255, 238, 198, 0.68); display: grid; gap: 6px; }
.p-scroll .p-head { display: flex; justify-content: space-between; align-items: baseline; color: #704c1e; font-size: .78rem; }
.p-scroll p { margin: 0; color: #3e3020; white-space: pre-wrap; font-weight: 400; line-height: 1.75; }
.p-scroll .p-narr { color: #6d5a3d; font-style: italic; }
.p-scroll .p-cue { color: #6d5a3d; font-style: italic; }
.p-scroll .p-speech { padding-left: 1.2em; }
.p-scroll .p-speech.p-first { margin-top: 4px; }
.p-scroll .p-speech.p-first::before { content: attr(data-who); display: block; margin-left: -1.2em; color: #704c1e; font-size: .78rem; font-weight: 700; font-style: normal; }
.p-scroll .p-whisper { margin: 4px 0 4px 2.2em; padding: 6px 10px; border: 1px dashed rgba(111, 83, 46, 0.5); border-radius: 5px; background: rgba(255, 238, 198, 0.5); font-style: italic; position: relative; }
.p-scroll .p-whisper::before { content: attr(data-who) " · 低语"; display: block; color: #704c1e; font-size: .74rem; font-weight: 700; font-style: normal; }
.p-scroll .p-scene { text-align: center; color: #6d5a3d; font-style: italic; padding: 6px 14px; }
.p-scroll.p-neutral p { color: #3e3020; }

/* 变体 C：剧本体（说话人栏） */
.p-script { align-self: stretch; display: grid; gap: 2px; padding: 8px 6px; border-top: 1px solid rgba(111,83,46,.18); }
.p-script .p-row { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 12px; align-items: start; }
.p-script .p-gut { color: #704c1e; font-size: .8rem; text-align: right; padding-top: 5px; font-weight: 700; }
.p-script .p-gut small { display: block; color: #94805d; font-weight: 400; font-size: .72rem; }
.p-script p { margin: 0; color: #3e3020; white-space: pre-wrap; font-weight: 400; line-height: 1.75; padding: 3px 0; }
.p-script .p-row.p-narr p, .p-script .p-row.p-cue p { color: #6d5a3d; font-style: italic; }
.p-script .p-row.p-whisper p { border-left: 2px dashed rgba(111,83,46,.5); padding-left: 10px; font-style: italic; }
.p-script .p-row.p-scene { grid-template-columns: minmax(0,1fr); }
.p-script .p-row.p-scene p { text-align: center; color: #6d5a3d; font-style: italic; }
.p-script .p-emperor { grid-template-columns: 6.5em minmax(0,1fr); }
.p-script .p-emperor .p-gut { color: #8f2f25; }
.p-script .p-emperor p { color: #5a1f16; font-weight: 700; }

/* 核账期：舞台与推演卷 */
.p-stage-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(90,70,40,.45), transparent 60%), linear-gradient(180deg, #2a2118, #120f0b); }
.p-topbar { position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: 15%; background: linear-gradient(180deg, rgba(0,0,0,.55), transparent); }
.p-year-tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border: 1px solid rgba(226,180,86,.5); border-radius: 3px; font-size: 1.2cqh; color: #f2c66a; vertical-align: middle; }
.p-menu { position: absolute; z-index: 4; left: 85.8%; top: 4.6%; color: #f6eccf; font-size: 1.8cqh; border: 1px solid rgba(226,180,86,.28); padding: .4cqh 1cqw; border-radius: 4px; background: rgba(20,14,8,.55); }

function emperorBubble(t) { return `<div class="chat-message user"><span>朕</span><p>${t}</p></div>`; }
function sysLine(text, btn) { return `<div class="chat-system-note danger chat-failure-note" role="alert"><span>${text}</span>${btn ? `<button type="button">${btn}</button>` : ''}</div>`; }

// 段落分组：同一说话人的连续 speech 合成一段（呈现层读转译标记）
function runs(paras) {
  const out = [];
  for (const p of paras) {
    const last = out[out.length - 1];
    if (p.k === 'speech' && last && last.k === 'speech' && last.who === p.who) { last.items.push(p); }
    else out.push({ k: p.k, who: p.who, items: [p] });
  }
  return out;
}
function strip(t) { return t.replace(/<\/?mark[^>]*>/g, ''); }

// A：一卷戏文
function turnA(turn, mode) { // mode: neutral | marked | streaming
  const paras = mode === 'streaming' ? turn.paras.slice(0, 2).concat([{ k: 'speech', who: turn.paras[2].who, t: turn.paras[2].t.slice(0, 26), caret: true }]) : turn.paras;
  const tag = mode === 'marked' ? '' : mode === 'streaming' ? '<span class="p-status-tag">殿上 · 回话中</span>' : '<span class="p-status-tag">殿上</span>';
  let body = '';
  if (mode === 'marked') {
    for (const r of runs(paras)) {
      if (r.k === 'speech') body += r.items.map((p, i) => `<p class="p-speech${i === 0 ? ' p-first' : ''}" data-who="${r.who}">${p.t}</p>`).join('');
      else if (r.k === 'whisper') body += `<p class="p-whisper" data-who="${r.who}">${r.items[0].t}</p>`;
      else if (r.k === 'cue') body += `<p class="p-cue">${r.items[0].t}</p>`;
      else if (r.k === 'scene') body += `<p class="p-scene">${r.items[0].t}</p>`;
      else body += `<p class="p-narr">${r.items[0].t}</p>`;
    }
  } else {
    body = paras.map((p) => `<p class="${p.caret ? 'p-caret' : ''}">${strip(p.t)}</p>`).join('');
  }
  return emperorBubble(turn.emperor) + `<div class="p-scroll ${mode === 'marked' ? '' : 'p-neutral'}"><div class="p-head"><span>殿上</span>${tag}</div>${body}</div>`;
}
// B：分气泡（转译到了才拆；未到 = 一条「殿上」气泡）
function turnB(turn, mode) {
  let out = emperorBubble(turn.emperor);
  if (mode !== 'marked') {
    const paras = mode === 'streaming' ? turn.paras.slice(0, 2).concat([{ t: turn.paras[2].t.slice(0, 26), caret: true }]) : turn.paras;
    out += `<div class="chat-message minister"><span>殿上${mode === 'streaming' ? ' · 回话中' : ''}</span>${paras.map((p) => `<p class="${p.caret ? 'p-caret' : ''}">${strip(p.t)}</p>`).join('')}</div>`;
    return out;
  }
  for (const r of runs(turn.paras)) {
    if (r.k === 'speech') out += `<div class="chat-message minister"><span>${r.who}</span>${r.items.map((p) => `<p>${p.t}</p>`).join('')}</div>`;
    else if (r.k === 'whisper') out += `<div class="chat-message minister aside"><div class="aside-avatar"><img src="${PORTRAITS[r.who]}" alt="${r.who}"></div><span>${r.who}</span><em class="action">凑近御座，声音压得极低</em><p>${r.items[0].t}</p></div>`;
    else if (r.k === 'cue') { /* 分气泡下提示语并入 aside 的 action，不重复显示 */ }
    else out += `<div class="chat-message scene"><p>${r.items[0].t}</p></div>`;
  }
  return out;
}
// C：剧本体
function turnC(turn, mode) {
  const paras = mode === 'streaming' ? turn.paras.slice(0, 2).concat([{ k: 'speech', who: turn.paras[2].who, t: turn.paras[2].t.slice(0, 26), caret: true }]) : turn.paras;
  let rows = `<div class="p-row p-emperor"><div class="p-gut">朕</div><p>${turn.emperor}</p></div>`;
  if (mode === 'marked') {
    for (const r of runs(paras)) {
      if (r.k === 'speech') rows += r.items.map((p, i) => `<div class="p-row"><div class="p-gut">${i === 0 ? r.who : ''}</div><p>${p.t}</p></div>`).join('');
      else if (r.k === 'whisper') rows += `<div class="p-row p-whisper"><div class="p-gut">${r.who}<small>低语 · 御前私</small></div><p>${r.items[0].t}</p></div>`;
      else if (r.k === 'cue') rows += `<div class="p-row p-cue"><div class="p-gut"></div><p>${r.items[0].t}</p></div>`;
      else if (r.k === 'scene') rows += `<div class="p-row p-scene"><p>${r.items[0].t}</p></div>`;
      else rows += `<div class="p-row p-narr"><div class="p-gut"></div><p>${r.items[0].t}</p></div>`;
    }
  } else {
    rows += paras.map((p, i) => `<div class="p-row"><div class="p-gut">${i === 0 ? '殿上' : ''}${i === 0 && mode === 'streaming' ? '<small>回话中</small>' : ''}</div><p class="${p.caret ? 'p-caret' : ''}">${strip(p.t)}</p></div>`).join('');
  }
  return `<div class="p-script">${rows}</div>`;
}

function renderAudience(variant, state, portrait) {
  const fn = { A: turnA, B: turnB, C: turnC }[variant];
  const modes = {
    streaming: ['marked', 'marked', 'streaming'],
    marked: ['marked', 'marked', 'neutral'],   // 第三轮刚说完：转译晚一句才到
    pending: ['marked', 'neutral', 'neutral'], // 第二轮转译耗尽 → 第三轮排队等（按轮串行）
    interrupted: ['marked', 'marked', 'marked'],
  }[state];
  let log = '';
  TURNS.forEach((t, i) => {
    log += fn(t, modes[i]);
    if (state === 'pending' && i === 1) log += sysLine('这一轮的记录尚未落定，可重试。', '重试');
  });
  if (state === 'interrupted') log += emperorBubble(TURN4_Q) + sysLine('上回问话未得回话，可重新生成。', '重试');

  const cast = CAST[state];
  const ALL = ['王承恩', '徐光启', '毕自严', '王绍徽'];
  const rosterItem = (n) => `<div class="p-roster-item ${cast.present.includes(n) ? '' : 'p-absent'}"><div class="p-avatar"><img src="${PORTRAITS[n]}" alt="${n}"></div><div>${n}<small>${TITLES[n]}${cast.present.includes(n) ? '' : ' · 已退'}</small></div></div>`;
  const summonItem = `<div class="p-roster-item p-summon"><div class="p-avatar">宣</div><div>名册点选 = 代发「宣 X」<small>0047 口令加速器</small></div></div>`;
  const secret = `<div class="p-secret"><div class="p-lab">密 令</div><p>李若琏 · 小厂卫 —— 本夜下令，承办中</p></div>`;
  const head = `<div class="minister-profile"><div><h2>乾清宫 · 夜</h2><p>${MONTH.label} · 在场诸人</p></div></div>`;

  let side, stage = '';
  if (portrait === '丙') {
    side = head + `<div class="p-roster">${ALL.map(rosterItem).join('')}${summonItem}</div>` + secret;
    stage = `<div class="p-stage-strip">${ALL.map((n) => `<div class="p-stage-fig ${cast.present.includes(n) ? (n === cast.speaker ? 'p-speaking' : '') : 'p-absent'}"><img src="${PORTRAITS[n]}" alt="${n}"><span>${n}</span></div>`).join('')}</div>`;
  } else {
    const who = portrait === '甲' ? cast.protagonist : portrait === '丁' ? cast.lead : cast.speaker;
    const cap = portrait === '甲' ? '殿上主角 · 最近宣入且在场' : portrait === '丁' ? '御前主角 · 转译判（宣 X 当场先切）' : '正在说话 · 按转译标记';
    side = head + `<div class="p-roster p-compact">${ALL.map(rosterItem).join('')}${summonItem}</div>` + secret +
      `<div class="chat-portrait-wrap"><img src="${PORTRAITS[who]}" alt="${who}"><div class="p-portrait-cap"><b>${who}</b>${cap}</div></div>`;
  }
  return `
  <div class="fullscreen-modal modal-bg-chat modal-layout-bare">
    <div class="modal-header-bare"><div class="modal-header-actions"><button class="icon-button" title="暂离">✕</button></div></div>
    <div class="chat-full-grid">
      <aside class="modal-pane minister-side">${side}</aside>
      <section class="modal-pane chat-main ${stage ? 'p-with-stage' : ''}">
        ${stage}
        <div class="chat-log chat-stage">
          <div class="p-audience-label">越次召对</div>
          ${log}
        </div>
        <div class="chat-composer">
          <div class="chat-input"><textarea placeholder="陛下有何旨意…（宣 X / 退朝 都是话）"></textarea></div>
          <div class="composer-actions"><button class="primary-action">奏</button><button style="min-height:34px;padding:4px 12px;border:1px solid rgba(111,83,46,.22);border-radius:4px;background:rgba(255,238,198,.56);color:#573d1f">撤回</button><button style="min-height:34px;padding:4px 12px;border:1px solid rgba(111,83,46,.22);border-radius:4px;background:rgba(255,238,198,.56);color:#573d1f">散夜（退朝）</button><span class="composer-hint" style="margin-left:auto">${cast.note}</span></div>
        </div>
      </section>
    </div>
  </div>`;
}

/* ───────── 核账期：三变体 ───────── */
function topbar(vals, settling) {
  return `<div class="p-topbar"></div>
  <div class="hud2-slot" style="left:25%;top:8.1%"><span class="hud2-block"><span class="hud2-lab">大明</span><span class="hud2-val">${MONTH.label}${settling ? '<span class="p-year-tag">核账</span>' : ''}</span></span></div>
  <div class="hud2-slot" style="left:38.1%;top:8.1%"><span class="hud2-block"><span class="hud2-lab">国库</span><span class="hud2-val">${vals.国库}</span></span></div>
  <div class="hud2-slot" style="left:50.9%;top:8.1%"><span class="hud2-block"><span class="hud2-lab">内库</span><span class="hud2-val">${vals.内库}</span></span></div>
  <div class="hud2-slot" style="left:63.6%;top:8.1%"><span class="hud2-metric-one"><span class="hud2-lab">民心</span><span class="hud2-val">${vals.民心}</span></span><span class="hud2-metric-one warn"><span class="hud2-lab">皇威</span><span class="hud2-val">${vals.皇威}</span></span></div>
  <div class="p-menu">菜单</div>
  ${['政', '吏', '省', '兵', '户', '工', '后'].map((n, i) => `<div class="hud2-nav ${settling && ['省', '兵', '政'].includes(n) ? 'settlement-closed' : ''}" style="top:${19.3 + i * 8.1}%">${n}</div>`).join('')}
  ${['奏疏', '邸报', '密令', '史册', '拟诏'].map((n, i) => `<div class="p-cmd ${settling && (n === '拟诏' || n === '密令') ? 'p-off' : ''} ${!settling && n === '邸报' ? 'p-on' : ''}" style="left:${[8, 26.2, 43, 57.5, 76.5][i]}%">${n}</div>`).join('')}`;
}
function segHtml(seg, opts) {
  const { streaming, doc } = opts || {};
  let secs = seg.secs;
  let inner = '';
  secs.forEach(([h, ...ps], si) => {
    const last = streaming && si === secs.length - 1;
    inner += `<h4>${h}</h4>` + ps.map((p, pi) => {
      if (last && pi === ps.length - 1) return `<p class="p-caret">${p.slice(0, 48)}</p>`;
      return `<p>${p}</p>`;
    }).join('');
  });
  return `<div class="p-seg">${seg.title ? `<h3 style="margin:.4cqh 0 .6cqh;font-size:2.1cqh;color:#3b1f16;text-align:center">${seg.title}</h3>` : ''}${inner}</div>`;
}
function segsFor(state) {
  if (state === 'streaming') return SEGS.slice(0, 2).map((s) => segHtml(s)).join('') + segHtml(SEGS[2], { streaming: true });
  if (state === 'stopped') return SEGS.slice(0, 2).map((s) => segHtml(s)).join('') + `<div class="p-sysline"><div><b>本月核账有一处未办完，可重试。</b><small>错误包已存：data/error_packs/turn14_attempt1 · 重开仍在此处</small></div><button type="button">重试</button></div>`;
  if (state === 'rescript') return SEGS.slice(0, 2).map((s) => segHtml(s)).join('') + `<div class="p-seg" style="color:#8a6424;font-style:italic">有司请旨——倪元璐密奏一桩，待皇爷批红后续演。</div>`;
  return SEGS.map((s) => segHtml(s)).join('');
}
function wangSlip(state) {
  const t = state === 'rescript' ? '有本待批，请皇爷于批红处裁示。' : '奴婢正在督办各部核账，事情在办，请皇爷稍候。';
  return `<div class="wang-settlement-slip"><span class="wang-settlement-slip-speaker">王承恩</span><span class="wang-settlement-slip-body">${t}</span></div>`;
}
function rescriptPage() {
  return `<div class="decision-page"><div class="decision-document">
    <div class="decision-head"><span class="decision-kicker">${MONTH.label} · 核账中 · 有司请旨</span><h2 class="decision-title">奏疏批红</h2></div>
    <section>
      <div class="decision-document-section"><span class="decision-section-label">疏文</span><h3>${RESCRIPT.title}</h3><p>${RESCRIPT.context}</p><p style="margin-top:6px">票拟：倪元璐（翰林院编修，督畿辅清丈）</p></div>
      <div class="decision-document-section"><span class="decision-section-label">内阁票拟</span><div class="decision-options">${RESCRIPT.options.map(([l, h], i) => `<button type="button" class="decision-option ${i === 2 ? 'is-picked' : ''}"><span class="decision-option-label">拟批：${l}</span><span class="decision-option-hint">${h}</span></button>`).join('')}</div></div>
      <div class="decision-document-section"><label class="decision-section-label">朱笔亲批</label><textarea class="decision-note" placeholder="亲笔补批（可选）"></textarea></div>
      <button type="button" class="decision-confirm">批红落印</button>
    </section>
  </div></div>`;
}
function renderSettlement(variant, state) {
  const advanced = state === 'advanced';
  const vals = advanced ? MONTH.live : MONTH.snap;
  let main = '';
  if (advanced) {
    main = `<div class="p-map">盘面（活值）</div><div class="p-issue">局势</div><div class="p-newmonth-note">十二月初 · 本月推演卷已成邸报<br><small style="font-size:1.4cqh;letter-spacing:.1em">点「邸报」看，不另呈一遍；章节记忆等机械尾在后台跑</small></div>`;
  } else if (variant === 'A') {
    main = `<div class="p-issue">局势</div><div class="p-vol"><div class="p-vol-head"><h2>本月推演卷</h2><small>档房核账中 · 段落定即存 · 刷新接着看</small></div><div class="p-vol-body">${segsFor(state)}</div></div>${wangSlip(state)}`;
  } else if (variant === 'B') {
    main = `<div class="p-issue">局势</div><div class="p-map p-masked">月初盘面（只读）</div><div class="p-drawer"><div class="p-vol-head"><h2>邸报房</h2><small>本月推演 · 段落定即存</small></div><div class="p-vol-body">${state === 'stopped' ? `<div class="p-sysline" style="margin:0 0 1cqh"><div><b>本月核账有一处未办完，可重试。</b><small>错误包已存：data/error_packs/turn14_attempt1</small></div><button type="button">重试</button></div>` + SEGS.slice(0, 2).map((s) => segHtml(s)).join('') : segsFor(state)}</div></div><div class="wang-settlement-slip" style="left:31%;max-width:40%"><span class="wang-settlement-slip-speaker">王承恩</span><span class="wang-settlement-slip-body">${state === 'rescript' ? '有本待批，请皇爷于批红处裁示。' : '奴婢正在督办各部核账，事情在办，请皇爷稍候。'}</span></div>`;
  } else {
    main = `<div class="p-doc-page"><div class="p-doc"><span class="p-kicker">${MONTH.label} · 邸报 · 档房核账中，月初之数未动</span><h2>${SEGS[0].title}</h2><div class="p-doc-wang"><b>王承恩</b><span>${state === 'rescript' ? '有本待批，请皇爷于批红处裁示。' : '奴婢正在督办各部核账，事情在办，请皇爷稍候。'}</span></div>${segsFor(state)}</div></div>`;
  }
  const strip = variant === 'C' && !advanced ? '<div class="p-doc-strip"></div>' : '';
  return `<div class="hud2-stage"><div class="p-stage-bg"></div>${strip}${topbar(vals, !advanced)}${main}${state === 'rescript' ? rescriptPage() : ''}</div>`;
}

/* ───────── 渲染 + 浮条 ───────── */
function render() {
  const { screen, variant, state, portrait } = params();
  const app = document.getElementById('app');
  app.innerHTML = screen === 'audience' ? renderAudience(variant, state, portrait) : renderSettlement(variant, state);
  const S = SCREENS[screen];
  const vKeys = Object.keys(S.variants);
  const bar = document.getElementById('bar');
  bar.innerHTML = `
    <button data-act="screen" data-v="audience" class="${screen === 'audience' ? 'p-on' : ''}">召对</button>
    <button data-act="screen" data-v="settlement" class="${screen === 'settlement' ? 'p-on' : ''}">核账期</button>
    <span class="p-sep"></span>
    <button data-act="prev">◀</button><span class="p-name">${variant} · ${S.variants[variant]}</span><button data-act="next">▶</button>
    <span class="p-sep"></span>
    ${Object.entries(S.states).map(([k, n]) => `<button data-act="state" data-v="${k}" class="${state === k ? 'p-on' : ''}">${n}</button>`).join('')}
    ${S.portraits ? '<span class="p-sep"></span>立绘 ' + Object.entries(S.portraits).map(([k, n]) => `<button data-act="portrait" data-v="${k}" class="${portrait === k ? 'p-on' : ''}">${k} ${n}</button>`).join('') : ''}`;
  bar.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    const act = b.dataset.act;
    if (act === 'screen') setParams({ screen: b.dataset.v });
    else if (act === 'state') setParams({ state: b.dataset.v });
    else if (act === 'portrait') setParams({ portrait: b.dataset.v });
    else if (act === 'prev' || act === 'next') {
      const i = vKeys.indexOf(variant);
      setParams({ variant: vKeys[(i + (act === 'next' ? 1 : vKeys.length - 1)) % vKeys.length] });
    }
  }));
  document.title = `#1823 mock · ${S.name} · ${variant} ${S.variants[variant]} · ${S.states[state]}${S.portraits ? ' · 立绘' + portrait : ''}`;
  // 同真 app：对话区默认跟到最新一轮（?scroll=mid 供截图看中段）
  const { scroll } = params();
  for (const sel of ['.chat-log', '.p-vol-body', '.p-doc-page']) {
    const el = app.querySelector(sel);
    if (el) el.scrollTop = scroll === 'mid' ? Math.round(el.scrollHeight * 0.42) : el.scrollHeight;
  }
}
document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const { screen, variant } = params();
  const vKeys = Object.keys(SCREENS[screen].variants);
  const i = vKeys.indexOf(variant);
  setParams({ variant: vKeys[(i + (e.key === 'ArrowRight' ? 1 : vKeys.length - 1)) % vKeys.length] });
});
render();
</script>
</body>
</html>
